name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - run: go build ./cmd/kothar
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: git diff --check
